# Render Blueprint — deploys the FrontDesk apps as free Web Services.
# Deploy: Render Dashboard → New → Blueprint → connect shintrinh/frontdesk
# → Apply. See docs/DEPLOY.md for the exact steps.
# NOTE (corrected 14/11, Render docs): a Blueprint sync is SAFE for the
# manually-set DATABASE_URL (Neon) — Render keeps env vars the Blueprint
# does not overwrite, and this file does not declare DATABASE_URL. Sync
# still redeploys and overwrites anything that conflicts with the
# Blueprint, so sync deliberately. Adding a service via sync is fine.
# Each service runs the generated app's thin server (see template/server.js).
# Render sets PORT automatically; the server reads it. The build installs
# the template's one dependency (pg) into template/node_modules, which is
# on the require path from template/lib/store-pg.js. The apps require the
# template core at runtime (../../template/server), so the full repo is
# present on each service.
# DATABASE_URL is NOT declared here: it points at the Neon free Postgres
# (no expiry) and is set manually in the dashboard on each service, so the
# connection string (a secret) never lands in this public repo. The old
# Render free database was removed: it expired 30 days after creation.
services:
  - type: web
    name: frontdesk-fixit-auto
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/fixit-auto
    buildCommand: npm install --prefix ../../template
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
    healthCheckPath: /api/health

  - type: web
    name: frontdesk-brightsmile-dental
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/brightsmile-dental
    buildCommand: npm install --prefix ../../template
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
    healthCheckPath: /api/health

  - type: web
    name: frontdesk-cafe-grumpy
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/cafe-grumpy
    buildCommand: npm install --prefix ../../template
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "20"
    healthCheckPath: /api/health

  # FrontDesk config builder (kit) as a shareable link. Per Render's
  # Blueprint spec, a static site is a service with type: web +
  # runtime: static (there is no top-level "staticSites" key and no
  # "type: static"; region is unsupported — static sites run on a
  # global CDN). Single self-contained page
  # (template/config-builder.html); the build copies it to kit/index.html
  # so the template file stays the one source of truth. No env vars, no
  # backend — free static hosting, no cold start. This is the reusable
  # client-facing asset: FenBig sends this link to a shop owner, they fill
  # it in on their phone, and the config it produces validates against
  # template/lib/config.js (incl. the nail-salon type).
  - type: web
    runtime: static
    name: frontdesk-kit
    buildCommand: mkdir -p kit && cp template/config-builder.html kit/index.html
    staticPublishPath: kit
